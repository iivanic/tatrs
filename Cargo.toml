[workspace]
members = ["crates/tatrs-core", "crates/tatrs-cli", "crates/tatrs-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["tatrs contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
